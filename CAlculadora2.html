<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de Precios con Ganancia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      background: linear-gradient(to right, #fceabb, #f8b500);
      min-height: 100vh;
      padding: 2rem;
    }
    .calculator {
      background: white;
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }
    .result {
      font-size: 1.3rem;
      font-weight: bold;
    }
    .emoji {
      font-size: 2rem;
    }
    table {
      margin-top: 2rem;
    }
    th, td {
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="calculator animate__animated animate__fadeInUp">
    <h2 class="text-center mb-4">📦 Calculadora de Precios para Productos</h2>

    <div class="row g-3">
      <div class="col-md-4">
        <label for="concepto" class="form-label">Nombre del producto</label>
        <input type="text" class="form-control" id="concepto" placeholder="Ej: Camiseta">
      </div>
      <div class="col-md-4">
        <label for="cost" class="form-label">Costo base ($)</label>
        <input type="number" class="form-control" id="cost" placeholder="Ej: 100">
      </div>
      <div class="col-md-4">
        <label for="margin" class="form-label">Ganancia (%)</label>
        <input type="number" class="form-control" id="margin" placeholder="Ej: 30">
      </div>
    </div>

    <div class="text-center mt-4">
      <button class="btn btn-success" onclick="calcularPrecio()">Agregar a la tabla ✅</button>
    </div>

    <div class="mt-4 text-center d-none animate__animated" id="resultado">
      <p class="result">💲 Precio sugerido: <span id="precioFinal" class="text-success">$0.00</span></p>
      <p class="result">📊 Ganancia: <span id="ganancia" class="text-primary">$0.00</span></p>
      <div class="emoji">🚀</div>
    </div>

    <div class="mt-5">
      <h4 class="text-center mb-3">🧾 Productos calculados</h4>
      <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover" id="tablaProductos">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>Concepto</th>
              <th>Costo base ($)</th>
              <th>Margen (%)</th>
              <th>Precio sugerido ($)</th>
              <th>Ganancia ($)</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="text-center mt-3">
        <button class="btn btn-outline-danger me-2" onclick="exportarPDF()">📄 Exportar PDF</button>
        <button class="btn btn-outline-primary" onclick="exportarExcel()">📊 Exportar Excel</button>
      </div>
    </div>
  </div>

  <script>
    let contador = 1;

    function calcularPrecio() {
      const concepto = document.getElementById('concepto').value.trim();
      const cost = parseFloat(document.getElementById('cost').value);
      const margin = parseFloat(document.getElementById('margin').value);

      if (!concepto || isNaN(cost) || isNaN(margin) || cost < 0 || margin < 0) {
        alert("Por favor, ingresa todos los campos correctamente.");
        return;
      }

      const ganancia = cost * (margin / 100);
      const precioFinal = cost + ganancia;

      // Mostrar resultado animado
      document.getElementById('precioFinal').textContent = `$${precioFinal.toFixed(2)}`;
      document.getElementById('ganancia').textContent = `$${ganancia.toFixed(2)}`;

      const resultadoDiv = document.getElementById('resultado');
      resultadoDiv.classList.remove('d-none', 'animate__fadeInUp');
      void resultadoDiv.offsetWidth;
      resultadoDiv.classList.add('animate__fadeInUp');

      // Agregar a la tabla
      const tabla = document.getElementById('tablaProductos').querySelector('tbody');
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${contador++}</td>
        <td>${concepto}</td>
        <td>$${cost.toFixed(2)}</td>
        <td>${margin.toFixed(2)}%</td>
        <td>$${precioFinal.toFixed(2)}</td>
        <td>$${ganancia.toFixed(2)}</td>
      `;
      tabla.appendChild(row);

      // Limpiar inputs
      document.getElementById('concepto').value = '';
      document.getElementById('cost').value = '';
      document.getElementById('margin').value = '';
    }

    function exportarExcel() {
      const tabla = document.getElementById('tablaProductos');
      const wb = XLSX.utils.table_to_book(tabla, {sheet: "Productos"});
      XLSX.writeFile(wb, "productos_calculados.xlsx");
    }

    function exportarPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text("Productos Calculados", 14, 10);

      const tabla = document.getElementById('tablaProductos');
      const data = [];
      const rows = tabla.querySelectorAll("tbody tr");

      rows.forEach(row => {
        const cols = row.querySelectorAll("td");
        const rowData = Array.from(cols).map(td => td.innerText);
        data.push(rowData);
      });

      doc.autoTable({
        head: [['#', 'Concepto', 'Costo base ($)', 'Margen (%)', 'Precio sugerido ($)', 'Ganancia ($)']],
        body: data,
        startY: 20,
      });

      doc.save("productos_calculados.pdf");
    }
  </script>

  <!-- AutoTable para PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</body>
</html>
